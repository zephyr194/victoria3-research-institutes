l_simp_chinese:
 building_ri_research_institute:0 "国家科研院所"
 building_ri_research_institute_desc:0 "由政府供养的实验室、技术档案室与研究团队，为国家科研计划提供基础。"
 bg_ri_research:0 "科研院所"
 pmg_ri_laboratory:0 "科研组织"
 pm_ri_laboratory:0 "专门实验室"
 pm_ri_research_network:0 "协作研究网络"
 ri_je:0 "国家科研计划"
 ri_je_reason:0 "建立至少一所雇员达到编制 50% 的国家科研院所，再设立国家计划。院所提供创新力；专项经费提高所选领域的研发速度。\nI 级：每周 £1,000，研发速度 +5%，行政力 -10。\nII 级：每周 £3,000，研发速度 +10%，行政力 -25。\nIII 级：每周 £8,000，研发速度 +20%，行政力 -50。\n院所工资与物资另由政府承担；创新力投资上限仍按原版规则计算。"
 ri_je_status:0 "建设科研院所，筹建国家科研计划。"
 ri_summary:0 "计划等级：[GetPlayer.MakeScope.Var('ri_tier').GetValue|0]；累计有效投入：[GetPlayer.MakeScope.Var('ri_paid_weeks').GetValue|0] 周。"
 ri_status_unchartered:0 "尚未设立。需要一所雇员达到编制 50% 的科研院所、10% 识字率及 £25,000 筹建经费。"
 ri_status_paused:0 "专项拨款已暂停；院所仍按生产方式正常运营。\n$ri_summary$"
 ri_status_facility:0 "没有雇员达到编制 50% 的科研院所。本周停止扣费和专项研发加成；恢复人员后自动复核。\n$ri_summary$"
 ri_status_funds:0 "黄金储备不足以支付本周专项经费。未扣费，不累计科研周数；储备恢复后自动复核。\n$ri_summary$"
 ri_status_waiting:0 "等待下次周更新核定拨款与研发加成。\n$ri_summary$"
 ri_status_production:0 "当前重点：生产科技。转向后从下次周更新重新拨款。\n$ri_summary$"
 ri_status_military:0 "当前重点：军事科技。转向后从下次周更新重新拨款。\n$ri_summary$"
 ri_status_society:0 "当前重点：社会科技。转向后从下次周更新重新拨款。\n$ri_summary$"
 ri_charter_button:0 "设立国家科研计划 · £25,000"
 ri_charter_button_desc:0 "需要雇员达到编制 50% 的科研院所与 10% 识字率。支付筹建经费，设为 I 级，默认重点为生产科技；下次周更新开始每周拨款 £1,000。"
 ri_expand_2_button:0 "升级 II 级 · £100,000"
 ri_expand_2_button_desc:0 "需要累计有效投入 26 周、30% 识字率与正常配员的院所。升级后从下次周更新起每周拨款 £3,000，所选领域研发速度 +10%，行政力 -25。"
 ri_expand_3_button:0 "升级 III 级 · £250,000"
 ri_expand_3_button_desc:0 "需要累计有效投入 78 周、50% 识字率与正常配员的院所。升级后从下次周更新起每周拨款 £8,000，所选领域研发速度 +20%，行政力 -50。"
 ri_downgrade_button:0 "缩减一级计划"
 ri_downgrade_button_desc:0 "减少一级经费规模，保留累计科研周数，不退还建设经费。立即撤销专项研发修正，下次周更新按较低等级重新拨款；将来扩编须重新支付升级费。"
 ri_focus_production_button:0 "转向生产科技"
 ri_focus_production_button_desc:0 "立即撤销原重点加成，下次周更新开始支持生产科技。转向后需等待 13 次周更新才能再次转向；不改变原版科技树中的研究目标。"
 ri_focus_military_button:0 "转向军事科技"
 ri_focus_military_button_desc:0 "立即撤销原重点加成，下次周更新开始支持军事科技。转向后需等待 13 次周更新才能再次转向；不改变原版科技树中的研究目标。"
 ri_focus_society_button:0 "转向社会科技"
 ri_focus_society_button_desc:0 "立即撤销原重点加成，下次周更新开始支持社会科技。转向后需等待 13 次周更新才能再次转向；不改变原版科技树中的研究目标。"
 ri_pause_button:0 "暂停专项拨款"
 ri_pause_button_desc:0 "立即撤销国家计划的研发与交流加成，终止本期交流。保留计划等级与累计科研周数；已支付的费用不退还。院所的工资、物资消耗与基础创新力不受此按钮控制，可在建筑面板缩减院所。"
 ri_resume_button:0 "恢复专项拨款"
 ri_resume_button_desc:0 "下次周更新重新检查人员与黄金储备，满足条件后扣款并恢复专项研发。已经终止的交流不会自动重开。"
 ri_exchange_je:0 "科技交流与译介"
 ri_exchange_je_reason:0 "资助学术考察、外文刊物译介与跨境通信，推动原版科技传播。立项费 £10,000，之后 26 周每周另拨 £500；实际付费周科技传播 +25%，影响力 -25。\n需要和平、20% 识字率和非闭关政策。每次立项间隔 78 周；战争、闭关、识字率不足、院所停摆或经费不足会在周更新时终止交流。此计划不创建双边外交条约，不指定或直接解锁某项科技。"
 ri_exchange_je_status:0 "筹备国际科技交流。"
 ri_exchange_summary:0 "尚待拨款：[GetPlayer.MakeScope.Var('ri_exchange_weeks').GetValue|0] 周；距离再次立项：[GetPlayer.MakeScope.Var('ri_exchange_cooldown').GetValue|0] 周。"
 ri_exchange_active:0 "交流项目已立项，从下次周更新开始或继续核定经费。\n$ri_exchange_summary$"
 ri_exchange_finishing:0 "最后一周交流已拨款，加成在下次周更新结束。\n$ri_exchange_summary$"
 ri_exchange_interrupted:0 "本期交流已终止。已支付费用不退还，再次立项仍须满足冷却与交流条件。\n$ri_exchange_summary$"
 ri_exchange_cooling:0 "本期交流已结束，等待下次立项。\n$ri_exchange_summary$"
 ri_exchange_ready:0 "可以筹备新一期科技交流；需要国家科研计划正在获得拨款。"
 ri_exchange_button:0 "资助科技交流 · £10,000"
 ri_exchange_button_desc:0 "需要本国和平、非闭关政策、20% 识字率、正常配员的院所以及正在拨款的国家科研计划。立即支付 £10,000；下次周更新起，除国家计划周费外另付 £500，最多 26 周。预留后续周费，立项后 78 周内不能再次立项。"
 ri_cancel_exchange_button:0 "终止本期交流"
 ri_cancel_exchange_button_desc:0 "立即撤销交流修正，取消尚未支付的交流周费。已经支付的费用不退还，78 周立项间隔继续计时；国家科研计划继续。"
