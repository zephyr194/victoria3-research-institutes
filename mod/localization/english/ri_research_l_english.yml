l_english:
 building_ri_research_institute:0 "State Research Institute"
 building_ri_research_institute_desc:0 "Public laboratories, technical archives and research staff supporting a national science programme."
 bg_ri_research:0 "Research Institutes"
 pmg_ri_laboratory:0 "Research Organisation"
 pm_ri_laboratory:0 "Specialist Laboratories"
 pm_ri_research_network:0 "Collaborative Research Network"
 ri_je:0 "National Research Programme"
 ri_je_reason:0 "Build a State Research Institute and staff it to at least 50% before chartering a national programme. Institutes generate Innovation; programme grants accelerate research in one selected category.\nTier I: £1,000/week, +5% research speed, -10 Bureaucracy.\nTier II: £3,000/week, +10% research speed, -25 Bureaucracy.\nTier III: £8,000/week, +20% research speed, -50 Bureaucracy.\nInstitute wages and supplies are separate government expenses. The vanilla Innovation investment cap still applies."
 ri_je_status:0 "Build an institute and charter a national research programme."
 ri_summary:0 "Programme tier: [GetPlayer.MakeScope.Var('ri_tier').GetValue|0]; funded research weeks: [GetPlayer.MakeScope.Var('ri_paid_weeks').GetValue|0]."
 ri_status_unchartered:0 "Not chartered. Requires an institute staffed to 50%, 10% Literacy and £25,000."
 ri_status_paused:0 "Programme grants are paused. Institutes continue operating their production methods.\n$ri_summary$"
 ri_status_facility:0 "No institute is staffed to 50%. No programme payment or research bonus this week. Staffing is checked again next week.\n$ri_summary$"
 ri_status_funds:0 "Gold Reserves cannot cover this week's grant. No payment, bonus or funded week is awarded. Reserves are checked again next week.\n$ri_summary$"
 ri_status_waiting:0 "Waiting for the next weekly grant assessment.\n$ri_summary$"
 ri_status_production:0 "Priority: Production technology. A changed priority receives funding at the next weekly update.\n$ri_summary$"
 ri_status_military:0 "Priority: Military technology. A changed priority receives funding at the next weekly update.\n$ri_summary$"
 ri_status_society:0 "Priority: Society technology. A changed priority receives funding at the next weekly update.\n$ri_summary$"
 ri_charter_button:0 "Charter Programme · £25,000"
 ri_charter_button_desc:0 "Requires an institute staffed to 50% and 10% Literacy. Pay the charter cost and establish tier I, prioritising Production. Weekly grants of £1,000 start at the next weekly update."
 ri_expand_2_button:0 "Expand to Tier II · £100,000"
 ri_expand_2_button_desc:0 "Requires 26 funded weeks, 30% Literacy and a staffed institute. From the next weekly update: £3,000/week, +10% selected-category research speed and -25 Bureaucracy."
 ri_expand_3_button:0 "Expand to Tier III · £250,000"
 ri_expand_3_button_desc:0 "Requires 78 funded weeks, 50% Literacy and a staffed institute. From the next weekly update: £8,000/week, +20% selected-category research speed and -50 Bureaucracy."
 ri_downgrade_button:0 "Reduce Programme by One Tier"
 ri_downgrade_button_desc:0 "Retain funded weeks without refunding establishment costs. Remove the current research modifier immediately; lower grants and bonuses start at the next weekly update. Expanding again requires paying the upgrade cost again."
 ri_focus_production_button:0 "Prioritise Production"
 ri_focus_production_button_desc:0 "Remove the previous bonus immediately and fund Production at the next weekly update. Priority changes have a 13-week cooldown. Does not change the research target selected in the vanilla technology tree."
 ri_focus_military_button:0 "Prioritise Military"
 ri_focus_military_button_desc:0 "Remove the previous bonus immediately and fund Military at the next weekly update. Priority changes have a 13-week cooldown. Does not change the research target selected in the vanilla technology tree."
 ri_focus_society_button:0 "Prioritise Society"
 ri_focus_society_button_desc:0 "Remove the previous bonus immediately and fund Society at the next weekly update. Priority changes have a 13-week cooldown. Does not change the research target selected in the vanilla technology tree."
 ri_pause_button:0 "Pause Programme Grants"
 ri_pause_button_desc:0 "Immediately remove programme research and exchange bonuses and terminate the current exchange. Retain tier and funded weeks; payments are not refunded. Institute wages, supplies and base Innovation continue. Downsize institutes in the building panel to reduce those expenses."
 ri_resume_button:0 "Resume Programme Grants"
 ri_resume_button_desc:0 "At the next weekly update, check staffing and Gold Reserves before resuming payments and research bonuses. Terminated exchanges are not restarted."
 ri_exchange_je:0 "Scientific Exchange and Translation"
 ri_exchange_je_reason:0 "Fund study missions, translated journals and international correspondence to improve vanilla Technology Spread. Setup: £10,000; an additional £500/week for 26 weeks. Funded weeks grant +25% Technology Spread and -25 Influence.\nRequires peace, 20% Literacy and a trade policy other than Isolationism. New projects are 78 weeks apart. War, Isolationism, insufficient Literacy, staffing or funds terminate the exchange at the weekly update. Creates no bilateral diplomatic pact and does not select or instantly unlock technologies."
 ri_exchange_je_status:0 "Prepare international scientific exchange."
 ri_exchange_summary:0 "Weeks still to fund: [GetPlayer.MakeScope.Var('ri_exchange_weeks').GetValue|0]; weeks until another project: [GetPlayer.MakeScope.Var('ri_exchange_cooldown').GetValue|0]."
 ri_exchange_active:0 "Exchange commissioned; grants begin or continue at the next weekly update.\n$ri_exchange_summary$"
 ri_exchange_finishing:0 "The last funded exchange week is in progress. Its bonus ends at the next weekly update.\n$ri_exchange_summary$"
 ri_exchange_interrupted:0 "Exchange terminated. Payments are not refunded. Cooldown and eligibility still apply to new projects.\n$ri_exchange_summary$"
 ri_exchange_cooling:0 "Exchange complete; waiting for the next project.\n$ri_exchange_summary$"
 ri_exchange_ready:0 "A new exchange can be commissioned while the national programme is receiving grants."
 ri_exchange_button:0 "Commission Scientific Exchange · £10,000"
 ri_exchange_button_desc:0 "Requires peace, no Isolationism, 20% Literacy, a staffed institute and a funded national programme. Pay £10,000 now; from the next weekly update pay an extra £500/week for up to 26 weeks. Reserve money for those bills. Another project cannot start for 78 weeks."
 ri_cancel_exchange_button:0 "Terminate Current Exchange"
 ri_cancel_exchange_button_desc:0 "Remove the exchange bonus and cancel unpaid exchange grants immediately. Payments are not refunded; the 78-week project cooldown continues. The national research programme continues."
